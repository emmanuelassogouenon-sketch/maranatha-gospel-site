<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jeux bibliques — MARANATHA GOSPEL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#0F1B2D; --dawn:#E8A94C; --dawn-soft:#F2C97D;
    --parchment:#F6F1E7; --ink:#1C1B18; --ember:#8B3A2B; --good:#3E7A4F; --bad:#B3452E;
  }
  *{box-sizing:border-box;}
  body{margin:0; background:var(--parchment); color:var(--ink); font-family:'Work Sans', sans-serif; line-height:1.55;}
  h1,h2{font-family:'Fraunces', serif; font-weight:500; margin:0;}
  .wrap{max-width:560px; margin:0 auto; padding:0 24px;}

  .navbar{background:var(--night); border-bottom:1px solid rgba(246,241,231,0.12);}
  .navbar .wrap{display:flex; align-items:center; justify-content:space-between; padding:14px 24px;}
  .nav-brand{font-size:14px; color:var(--parchment); display:flex; align-items:center; gap:8px;}
  .nav-brand .dot{width:6px;height:6px;border-radius:50%;background:var(--dawn);}
  .back-link{font-size:14px; color:var(--dawn-soft); text-decoration:none;}

  .top{background:var(--night); color:var(--parchment); padding:36px 0 42px;}
  .top .eyebrow{color:var(--dawn-soft); font-size:14px; margin-bottom:10px;}
  .top h1{font-size:clamp(26px,6vw,32px);}

  .quiz-wrap{padding:34px 0 60px;}
  .progress{font-size:13px; color:#8a8778; margin-bottom:18px;}
  .question-card{background:#FFFDF8; border:1px solid #E4DCC9; padding:24px;}
  .question-card h2{font-size:19px; margin-bottom:20px;}
  .option{
    display:block; width:100%; text-align:left; padding:13px 16px; margin-bottom:10px;
    background:var(--parchment); border:1px solid #D8CFB8; font-size:15px; font-family:'Work Sans', sans-serif; cursor:pointer;
  }
  .option.correct{background:var(--good); border-color:var(--good); color:#fff;}
  .option.wrong{background:var(--bad); border-color:var(--bad); color:#fff;}
  .option:disabled{cursor:default;}

  .next-btn{
    margin-top:18px; padding:12px 22px; background:var(--night); color:var(--parchment); border:none; font-size:15px; cursor:pointer; display:none;
  }
  .next-btn.show{display:inline-block;}

  .result{text-align:center; padding:20px 0;}
  .result .score{font-family:'Fraunces', serif; font-size:44px; margin:14px 0;}
  .restart-btn{
    margin-top:18px; padding:13px 24px; background:var(--dawn); color:var(--night); border:none; font-size:15px; font-weight:500; cursor:pointer;
  }

  footer{padding:28px 0 40px; font-size:13px; color:#8a8778; text-align:center;}
</style>
</head>
<body>

  <nav class="navbar">
    <div class="wrap">
      <div class="nav-brand"><span class="dot"></span>MARANATHA GOSPEL</div>
      <a class="back-link" href="index.html">← Accueil</a>
    </div>
  </nav>

  <header class="top">
    <div class="wrap">
      <p class="eyebrow">Apprendre en s'amusant</p>
      <h1>Quiz biblique</h1>
    </div>
  </header>

  <div class="wrap quiz-wrap">
    <div id="quiz-container"></div>
  </div>

  <footer>MARANATHA GOSPEL — depuis 2024</footer>

<script>
  const QUESTIONS = [
    { q: "Qui a construit l'arche pour survivre au déluge ?", options: ["Abraham", "Noé", "Moïse", "Job"], answer: 1 },
    { q: "Combien Jésus avait-il de disciples proches (apôtres) ?", options: ["7", "10", "12", "15"], answer: 2 },
    { q: "Qui a trahi Jésus pour trente pièces d'argent ?", options: ["Pierre", "Thomas", "Judas", "Jean"], answer: 2 },
    { q: "Dans quelle ville Jésus est-il né ?", options: ["Nazareth", "Jérusalem", "Bethléem", "Capernaüm"], answer: 2 },
    { q: "Qui a vaincu le géant Goliath ?", options: ["Saül", "David", "Samson", "Josué"], answer: 1 },
    { q: "Qui a été avalé par un grand poisson ?", options: ["Élie", "Jonas", "Daniel", "Ézéchiel"], answer: 1 },
    { q: "Quel est le premier livre de la Bible ?", options: ["Exode", "Genèse", "Lévitique", "Job"], answer: 1 },
    { q: "Qui a reçu les dix commandements sur le mont Sinaï ?", options: ["Aaron", "Josué", "Moïse", "Abraham"], answer: 2 },
    { q: "Qui a été vendu comme esclave par ses propres frères ?", options: ["Benjamin", "Joseph", "Ruben", "Juda"], answer: 1 },
    { q: "Quel roi d'Israël était réputé pour sa grande sagesse ?", options: ["Saül", "David", "Salomon", "Ezéchias"], answer: 2 },
    { q: "Qui a renié Jésus trois fois avant le chant du coq ?", options: ["Pierre", "André", "Jacques", "Thomas"], answer: 0 },
    { q: "Quel est le premier miracle de Jésus, à Cana ?", options: ["Guérir un aveugle", "Marcher sur l'eau", "Changer l'eau en vin", "Nourrir 5000 personnes"], answer: 2 },
    { q: "Qui a été le premier homme créé par Dieu ?", options: ["Adam", "Caïn", "Seth", "Abel"], answer: 0 },
    { q: "Quel prophète a été enlevé au ciel dans un char de feu ?", options: ["Élisée", "Élie", "Ésaïe", "Jérémie"], answer: 1 },
    { q: "Combien de jours Jésus a-t-il jeûné dans le désert ?", options: ["7", "12", "40", "50"], answer: 2 },
    { q: "Qui a vendu son droit d'aînesse pour un plat de lentilles ?", options: ["Jacob", "Ésaü", "Isaac", "Laban"], answer: 1 },
    { q: "Quel est le dernier livre de la Bible ?", options: ["Apocalypse", "Jude", "Malachie", "Actes"], answer: 0 },
    { q: "Qui était le père de Jean-Baptiste ?", options: ["Joseph", "Zacharie", "Siméon", "Nicodème"], answer: 1 },
  ];

  function shuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  let order = shuffle(QUESTIONS).slice(0, 10);
  let current = 0;
  let score = 0;

  const container = document.getElementById("quiz-container");

  function renderQuestion() {
    if (current >= order.length) return renderResult();
    const item = order[current];
    container.innerHTML = `
      <p class="progress">Question ${current + 1} / ${order.length} — Score : ${score}</p>
      <div class="question-card">
        <h2>${item.q}</h2>
        ${item.options.map((opt, i) => `<button class="option" data-i="${i}">${opt}</button>`).join("")}
        <button class="next-btn" id="next-btn">Suivant</button>
      </div>
    `;
    const buttons = container.querySelectorAll(".option");
    buttons.forEach(btn => {
      btn.addEventListener("click", () => {
        buttons.forEach(b => b.disabled = true);
        const i = parseInt(btn.dataset.i);
        if (i === item.answer) {
          btn.classList.add("correct");
          score++;
        } else {
          btn.classList.add("wrong");
          buttons[item.answer].classList.add("correct");
        }
        document.getElementById("next-btn").classList.add("show");
      });
    });
    document.getElementById("next-btn").addEventListener("click", () => {
      current++;
      renderQuestion();
    });
  }

  function renderResult() {
    container.innerHTML = `
      <div class="result">
        <p class="progress">C'est terminé !</p>
        <div class="score">${score} / ${order.length}</div>
        <p>${score >= order.length * 0.8 ? "Excellente connaissance de la Parole ! 🙌" : score >= order.length * 0.5 ? "Bien joué, continue à creuser la Bible 📖" : "Belle occasion de redécouvrir ces récits 📖"}</p>
        <button class="restart-btn" id="restart-btn">Rejouer</button>
      </div>
    `;
    document.getElementById("restart-btn").addEventListener("click", () => {
      order = shuffle(QUESTIONS).slice(0, 10);
      current = 0;
      score = 0;
      renderQuestion();
    });
  }

  renderQuestion();
</script>
</body>
</html>
